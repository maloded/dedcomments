fragment CommentThreadFields on ThreadCommentModel {
  id
  text
  parentId
  createdAt
  repliesCount
  author {
    id
    username
    email
  }
  attachment {
    id
    type
    url
    originalName
    size
    processedAt
  }
}

# GraphQL has no recursive-fragment construct (a fragment can't spread itself),
# so an arbitrary-depth tree has to be selected out to a fixed depth by hand.
# The backend has no recursion limit at all (commentThread's CTE walks however
# deep parentId chains actually go — see CLAUDE.md's post-Step-13/14 fix entry:
# a reply beyond whatever depth is unrolled here still gets created just fine,
# it silently never renders, which is the bug that entry fixes). 30 levels
# is a large multiple of the UI's own visual depth cap (6, 3-4 on mobile — see
# CommentThreadNode.module.scss) and of any depth exercised in manual testing
# so far; CommentThreadNode additionally shows an explicit notice (not silence)
# if a thread ever grows past even this many levels, so a future hit isn't a
# repeat of the original bug.
query CommentThread($rootId: ID!) {
  commentThread(rootId: $rootId) {
    ...CommentThreadFields
    replies {
      ...CommentThreadFields
      replies {
        ...CommentThreadFields
        replies {
          ...CommentThreadFields
          replies {
            ...CommentThreadFields
            replies {
              ...CommentThreadFields
              replies {
                ...CommentThreadFields
                replies {
                  ...CommentThreadFields
                  replies {
                    ...CommentThreadFields
                    replies {
                      ...CommentThreadFields
                      replies {
                        ...CommentThreadFields
                        replies {
                          ...CommentThreadFields
                          replies {
                            ...CommentThreadFields
                            replies {
                              ...CommentThreadFields
                              replies {
                                ...CommentThreadFields
                                replies {
                                  ...CommentThreadFields
                                  replies {
                                    ...CommentThreadFields
                                    replies {
                                      ...CommentThreadFields
                                      replies {
                                        ...CommentThreadFields
                                        replies {
                                          ...CommentThreadFields
                                          replies {
                                            ...CommentThreadFields
                                            replies {
                                              ...CommentThreadFields
                                              replies {
                                                ...CommentThreadFields
                                                replies {
                                                  ...CommentThreadFields
                                                  replies {
                                                    ...CommentThreadFields
                                                    replies {
                                                      ...CommentThreadFields
                                                      replies {
                                                        ...CommentThreadFields
                                                        replies {
                                                          ...CommentThreadFields
                                                          replies {
                                                            ...CommentThreadFields
                                                            replies {
                                                              ...CommentThreadFields
                                                              replies {
                                                                ...CommentThreadFields
                                                              }
                                                            }
                                                          }
                                                        }
                                                      }
                                                    }
                                                  }
                                                }
                                              }
                                            }
                                          }
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
