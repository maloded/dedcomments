# Comments SPA — local / deploy stack.
#
#   Infra only (for `npm run start:dev` on the host):
#     docker compose up -d postgres redis rabbitmq
#
#   Full stack (API in a container too):
#     docker compose up -d --build
#
# The backend container is fully configured from backend/.env (copy it from
# backend/.env.example first). The infra services below only need a few values;
# they fall back to the defaults shown here, or you can pass your own with
#   docker compose --env-file backend/.env up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: comments_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comments}
      POSTGRES_DB: ${POSTGRES_DB:-comments}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-comments} -d ${POSTGRES_DB:-comments}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - comments

  redis:
    image: redis:7-alpine
    container_name: comments_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - comments

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: comments_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI  -> http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - comments

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comments_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # Override host-oriented URLs from .env with in-network service names.
      DATABASE_URL: postgresql://${POSTGRES_USER:-comments}:${POSTGRES_PASSWORD:-comments}@postgres:5432/${POSTGRES_DB:-comments}?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - comments

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  comments:
    driver: bridge
